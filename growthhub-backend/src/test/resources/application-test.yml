spring:
  datasource:
    url: jdbc:h2:mem:growthhub_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test
            client-secret: test
          google:
            client-id: test
            client-secret: test

server:
  servlet:
    context-path: /api
